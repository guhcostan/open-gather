# Benchmark mode for the production stack (bench/run-vm.sh uses it): the same Caddy + Tilework + LiveKit
# containers, but the app writes to its own database file, is not a public demo (no per-IP sign-up limit) and
# admits up to 2000 players. Join with a multi-use invite. Remove the override to go back to normal.
#   docker compose -f docker-compose.yml -f docker-compose.bench.yml up -d tilework
services:
  tilework:
    environment:
      TILEWORK_DEMO: ""
      TILEWORK_DB: /data/bench.db
      TILEWORK_MAX_PLAYERS: "2000"
