# LOCAL / EVALUATION ONLY. Uses the public LiveKit dev key pair, plain HTTP and no TLS.
# Camera/microphone work on http://localhost because browsers treat localhost as a secure context.
# Never expose this stack to the internet. For a real deployment use docker-compose.yml.
#   docker compose -f deploy/docker-compose.local.yml up --build
name: tilework-local
services:
  tilework:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      TILEWORK_ENV: dev
      TILEWORK_ADDR: ":8080"
      TILEWORK_DB: "${TILEWORK_DB:-/data/tilework.db}"
      TILEWORK_ALLOWED_ORIGINS: "localhost:*,127.0.0.1:*"
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["tilework-data:/data"]
    depends_on: [livekit]
  livekit:
    image: livekit/livekit-server:v1.13.7
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
volumes:
  tilework-data:
    name: "${TILEWORK_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-tilework-local}_tilework-data}"
